name: Keep Workflows Alive

# GitHub disables scheduled workflows after 60 days without repo activity.
# Re-enabling them through the API every week resets that timer, including for this workflow itself.
on:
  schedule:
    - cron: "0 6 * * 1" # every Monday
  workflow_dispatch:

permissions:
  actions: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - name: Re-enable all workflows
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for id in $(gh api "repos/${{ github.repository }}/actions/workflows" --jq '.workflows[].id'); do
            gh api -X PUT "repos/${{ github.repository }}/actions/workflows/$id/enable" && echo "enabled $id"
          done
